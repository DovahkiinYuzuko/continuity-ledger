<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title data-i18n="app.title">積んでたら台帳</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="apple-touch-icon" href="assets/icons/icon.svg">
<meta name="theme-color" content="#2a2622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg style="display:none">
  <symbol id="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.268 21a2 2 0 0 0 3.464 0" />
    <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
  </symbol>
  <symbol id="icon-file-spreadsheet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
    <path d="M14 2v5a1 1 0 0 0 1 1h5" />
    <path d="M8 13h2" /><path d="M14 13h2" /><path d="M8 17h2" /><path d="M14 17h2" />
  </symbol>
  <symbol id="icon-braces" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1" />
    <path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1" />
  </symbol>
  <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12" /><path d="m17 8-5-5-5 5" />
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
  </symbol>
  <symbol id="icon-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" />
    <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" /><line x1="15.41" x2="8.59" y1="6.51" y2="10.49" />
  </symbol>
  <symbol id="icon-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
    <path d="m15 5 4 4" />
  </symbol>
  <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 6 6 18" /><path d="m6 6 12 12" />
  </symbol>
  <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m15 18-6-6 6-6" />
  </symbol>
  <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m9 18 6-6-6-6" />
  </symbol>
  <symbol id="icon-chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m18 15-6-6-6 6" />
  </symbol>
  <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 9 6 6 6-6" />
  </symbol>
  <symbol id="icon-rotate-ccw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" />
  </symbol>
  <symbol id="icon-calendar-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" />
    <path d="M3 9h18" /><path d="m9 15 2 2 4-4" />
  </symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14" /><path d="M12 5v14" />
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6 9 17l-5-5" />
  </symbol>
  <symbol id="icon-trash-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 11v6" /><path d="M14 11v6" />
    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
    <path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
  </symbol>
  <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
  </symbol>
  <symbol id="icon-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10" />
    <circle cx="12" cy="12" r="6" />
    <circle cx="12" cy="12" r="2" />
  </symbol>
  <symbol id="icon-calculator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="2" width="16" height="20" rx="2" />
    <line x1="8" x2="16" y1="6" y2="6" />
    <line x1="16" x2="16" y1="14" y2="18" />
    <path d="M16 10h.01" /><path d="M12 10h.01" /><path d="M8 10h.01" />
    <path d="M12 14h.01" /><path d="M8 14h.01" /><path d="M12 18h.01" /><path d="M8 18h.01" />
  </symbol>
  <symbol id="icon-trending-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
    <polyline points="16 7 22 7 22 13" />
  </symbol>
  <symbol id="icon-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 2 7 12 12 22 7 12 2" />
    <polyline points="2 17 12 22 22 17" />
    <polyline points="2 12 12 17 22 12" />
  </symbol>
</svg>

<div class="wrap">
  <header>
    <div class="eyebrow" data-i18n="app.eyebrow">CONTINUITY LEDGER</div>
    <h1 data-i18n="app.title">積んでたら台帳</h1>
    <div class="sub" data-i18n="app.sub">続けてたら、今頃これだけ。ただの記帳。</div>
    <div class="header-tools">
      <button class="tool-btn" id="simulatorBtn" title="目標期日シミュレーター"><svg class="icon"><use href="#icon-calculator"/></svg> <span data-i18n="tools.simulator">逆算シミュレーター</span></button>
      <button class="tool-btn" id="notifyBtn"><svg class="icon"><use href="#icon-bell"/></svg> <span data-i18n="tools.notify">通知</span> <span id="notifyState" data-i18n="tools.notify_off">オフ</span></button>
      <button class="tool-btn" id="exportBtn"><svg class="icon"><use href="#icon-file-spreadsheet"/></svg> <span data-i18n="tools.csv">CSV</span></button>
      <button class="tool-btn" id="exportJsonBtn"><svg class="icon"><use href="#icon-braces"/></svg> <span data-i18n="tools.json">JSON</span></button>
      <button class="tool-btn" id="importBtn"><svg class="icon"><use href="#icon-upload"/></svg> <span data-i18n="tools.json_import">JSON読込</span></button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </header>

  <div class="grand-total" id="grandTotal"></div>

  <div class="ledger-section-head">
    <button class="add-toggle" id="addToggle" data-i18n="ledger.btn_add_toggle">＋ 新しいシナリオを記帳する</button>
  </div>

  <div id="ledgerList" class="ledger-list"></div>

  <!-- シナリオ作成 / 編集モーダル/フォーム -->
  <div class="form-card" id="formCard">
    <div class="form-title" id="formTitle" data-i18n="form.title_new">新規記帳</div>
    <div class="field-row">
      <div class="field full">
        <label data-i18n="form.label_name">名称（任意）</label>
        <input type="text" id="fName" data-i18n-placeholder="form.placeholder_name" placeholder="例：定期貯金、積立シミュレーション">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label data-i18n="form.label_start">開始日</label>
        <input type="date" id="fStart">
      </div>
      <div class="field">
        <label data-i18n="form.label_end">終了日（任意）</label>
        <input type="date" id="fEnd">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label data-i18n="form.label_amount">1回あたりの金額</label>
        <input type="text" inputmode="decimal" id="fAmount" data-i18n-placeholder="form.placeholder_amount" placeholder="1000">
      </div>
      <div class="field">
        <label data-i18n="form.label_currency">通貨単位</label>
        <input type="text" id="fCurrency" data-i18n-placeholder="form.default_currency" placeholder="円" value="円">
      </div>
    </div>
    <div class="field-row">
      <div class="field full">
        <label data-i18n="form.label_target_amount">目標金額（任意・到達日を試算）</label>
        <input type="text" inputmode="decimal" id="fTargetAmount" data-i18n-placeholder="form.placeholder_target_amount" placeholder="例：100000">
      </div>
    </div>
    <div class="field-row">
      <div class="field full">
        <label data-i18n="form.label_interval_type">間隔タイプ</label>
        <select id="fIntervalType">
          <option value="days" data-i18n="form.interval_days">n日ごと</option>
          <option value="monthlyDate" data-i18n="form.interval_monthly_date">毎月指定日</option>
          <option value="monthlyLast" data-i18n="form.interval_monthly_last">毎月末日</option>
        </select>
      </div>
    </div>
    <div class="field-row" id="daysIntervalRow">
      <div class="field full">
        <label data-i18n="form.label_interval_days_num">間隔日数</label>
        <div class="interval-row">
          <input type="number" id="fInterval" min="1" value="1">
          <span class="interval-unit-label" data-i18n="form.unit_days_every">日ごと</span>
        </div>
      </div>
    </div>
    <div class="field-row" id="monthlyDateRow" style="display:none">
      <div class="field full">
        <label data-i18n="form.label_monthly_date_num">指定日付</label>
        <div class="interval-row">
          <span class="interval-unit-label" data-i18n="form.unit_monthly_prefix">毎月</span>
          <input type="number" id="fMonthDay" min="1" max="31" value="1">
          <span class="interval-unit-label" data-i18n="form.unit_monthly_suffix">日（31日を超える月は月末扱い）</span>
        </div>
        <div class="shortcut-row">
          <button type="button" class="shortcut-btn" data-day="1" data-i18n="form.shortcut_month_start">月初（1日）</button>
          <button type="button" class="shortcut-btn" data-day="15" data-i18n="form.shortcut_month_mid">月中（15日）</button>
          <button type="button" class="shortcut-btn" data-day="31" data-i18n="form.shortcut_month_end">月末（末日）</button>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="field full">
        <label data-i18n="form.label_color">カラータグ</label>
        <div class="color-picker" id="colorPicker"></div>
        <input type="color" id="customColor" class="custom-color-hidden-input">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" id="cancelBtn" data-i18n="form.btn_cancel">キャンセル</button>
      <button class="btn-primary" id="saveBtn" data-i18n="form.btn_save_new">保存する</button>
    </div>
  </div>

  <!-- 目標期日逆算シミュレーターモーダル -->
  <div class="modal-overlay" id="simulatorModal" style="display:none">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title"><svg class="icon"><use href="#icon-calculator"/></svg> <span data-i18n="simulator.title">目標期日シミュレーター</span></div>
        <button class="modal-close" id="simCloseBtn"><svg class="icon-sm"><use href="#icon-x"/></svg></button>
      </div>
      <div class="modal-sub" data-i18n="simulator.subtitle">希望の期日までに目標金額を貯めるための1回あたり必要額を逆算します</div>
      <div class="field-row">
        <div class="field full">
          <label data-i18n="simulator.label_target_date">目標期日</label>
          <input type="date" id="simTargetDate">
        </div>
      </div>
      <div class="field-row">
        <div class="field full">
          <label data-i18n="simulator.label_target_amount">目標金額</label>
          <input type="text" inputmode="decimal" id="simTargetAmount" data-i18n-placeholder="simulator.placeholder_target_amount" placeholder="例：1000000">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-primary" id="simCalcBtn" data-i18n="simulator.btn_calc">必要額を逆算</button>
      </div>
      <div class="sim-result-card" id="simResult" style="display:none"></div>
    </div>
  </div>

  <div class="year-summary" id="yearSummary"></div>

  <div class="cal-header">
    <div class="cal-title-row">
      <select id="jumpYear" class="jump-select"></select>
      <select id="jumpMonth" class="jump-select"></select>
      <button id="todayBtn" class="tool-btn" title="今月に戻る"><svg class="icon"><use href="#icon-rotate-ccw"/></svg></button>
      <button id="yearViewBtn" class="tool-btn" title="年間プレビュー"><svg class="icon"><use href="#icon-calendar-check"/></svg></button>
    </div>
    <div class="cal-nav">
      <button id="prevMonth" aria-label="Previous Month"><svg class="icon"><use href="#icon-chevron-left"/></svg></button>
      <div class="cal-title" id="calTitle"></div>
      <button id="nextMonth" aria-label="Next Month"><svg class="icon"><use href="#icon-chevron-right"/></svg></button>
    </div>
  </div>

  <!-- カレンダーコンテナ（ドラッグ/スワイプ対応） -->
  <div class="cal-wrapper" id="calWrapper">
    <div class="cal-grid" id="calGrid"></div>
    <div class="year-grid" id="yearGrid" style="display:none"></div>
  </div>

  <!-- カレンダーセル用ツールチップ -->
  <div class="cal-tooltip" id="calTooltip" style="display:none"></div>

  <div class="day-detail" id="dayDetail">
    <div class="day-detail-date" id="dayDetailDate"></div>
    <div id="dayDetailBody"></div>
    <div class="interrupt-row" id="interruptRow">
      <div class="interrupt-label" data-i18n="day_detail.interrupt_title">指定日への割り込み入金を記録</div>
      <div class="interrupt-form">
        <select id="interruptScenario"></select>
        <input type="text" inputmode="decimal" id="interruptAmount" data-i18n-placeholder="day_detail.placeholder_interrupt_amount" placeholder="金額（例：3000）">
        <button id="interruptAdd" data-i18n="day_detail.btn_interrupt_add">割り込みを記録</button>
      </div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-head">
      <div>
        <div class="chart-title"><svg class="icon"><use href="#icon-trending-up"/></svg> <span data-i18n="chart.title">積み上がり推移チャート</span></div>
        <div class="chart-sub" data-i18n="chart.subtitle">開始日からの累計推移（本日時点および将来予定）</div>
      </div>
      <div class="chart-controls">
        <div class="chart-period-group">
          <button class="chart-btn" data-period="1y" data-i18n="chart.period_1y">1年</button>
          <button class="chart-btn" data-period="3y" data-i18n="chart.period_3y">3年</button>
          <button class="chart-btn" data-period="5y" data-i18n="chart.period_5y">5年</button>
          <button class="chart-btn active" data-period="all" data-i18n="chart.period_all">全期間</button>
        </div>
        <div class="chart-type-group">
          <button class="chart-btn active" data-type="line" data-i18n="chart.mode_line">折れ線</button>
          <button class="chart-btn" data-type="stack" data-i18n="chart.mode_stack">積み上げ面</button>
        </div>
      </div>
    </div>
    <div class="chart-container" id="chartContainer">
      <canvas id="chartCanvas"></canvas>
    </div>
  </div>

  <footer data-i18n="app.footer">すべての記帳はこの端末の中だけに残ります</footer>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
