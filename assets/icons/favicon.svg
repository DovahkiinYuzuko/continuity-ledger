<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景（和紙調） -->
  <rect width="512" height="512" rx="115" fill="#efeae0"/>
  
  <!-- 1. 一番奥のカレンダーページ（過去の月・薄め） -->
  <g transform="rotate(-15 220 240)">
    <rect x="70" y="80" width="280" height="260" rx="26" fill="#e5dfd2" stroke="#2a2622" stroke-width="8" opacity="0.6"/>
  </g>

  <!-- 2. 中間のカレンダーページ（先月・台帳の厚み） -->
  <g transform="rotate(-11 230 250)">
    <rect x="76" y="90" width="290" height="270" rx="28" fill="#ede7dc" stroke="#2a2622" stroke-width="10"/>
    <line x1="76" y1="150" x2="366" y2="150" stroke="#d8d0bf" stroke-width="8"/>
  </g>

  <!-- 3. メインの手前カレンダー（今月） -->
  <g transform="rotate(-6 235 255)">
    <rect x="80" y="95" width="295" height="275" rx="28" fill="#f7f4ec" stroke="#2a2622" stroke-width="12"/>
    <line x1="80" y1="160" x2="375" y2="160" stroke="#a4402f" stroke-width="12"/>
    
    <!-- カレンダーバインダーホール -->
    <circle cx="130" cy="128" r="7" fill="#2a2622"/>
    <circle cx="325" cy="128" r="7" fill="#2a2622"/>

    <!-- 日付点々グリッド -->
    <circle cx="130" cy="205" r="9" fill="#d8d0bf"/>
    <circle cx="185" cy="205" r="9" fill="#d8d0bf"/>
    <circle cx="240" cy="205" r="9" fill="#d8d0bf"/>
    <!-- ★日付マス目（295, 205）にジャストインした朱印チェック！★ -->
    <circle cx="295" cy="205" r="20" fill="#a4402f"/>
    <path d="M288 205 l5 5 l10 -10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="130" cy="260" r="9" fill="#d8d0bf"/>
    <circle cx="185" cy="260" r="9" fill="#d8d0bf"/>
    <circle cx="240" cy="260" r="9" fill="#d8d0bf"/>
    <circle cx="295" cy="260" r="9" fill="#d8d0bf"/>

    <circle cx="130" cy="315" r="9" fill="#d8d0bf"/>
    <circle cx="185" cy="315" r="9" fill="#d8d0bf"/>
  </g>

  <!-- 4. 手前に重なる紙幣（お札モチーフ・和紙グリーン） -->
  <g transform="rotate(10 290 330)">
    <rect x="180" y="270" width="190" height="105" rx="14" fill="#e8ede4" stroke="#2a2622" stroke-width="10"/>
    <rect x="194" y="284" width="162" height="77" rx="8" fill="none" stroke="#4a5d43" stroke-width="4" stroke-dasharray="6 5"/>
    <circle cx="275" cy="322" r="22" fill="#d0dec6" stroke="#4a5d43" stroke-width="4.5"/>
    <circle cx="275" cy="322" r="9" fill="#4a5d43"/>
  </g>

  <!-- 5. 右上に突き抜けるシャープな鉛筆 -->
  <g transform="translate(405, 90) rotate(42)">
    <polygon points="0,0 -16,-34 16,-34" fill="#2a2622"/>
    <polygon points="0,0 -6,-14 6,-14" fill="#a4402f"/>
    <polygon points="-16,-34 16,-34 16,-42 -16,-42" fill="#efeae0"/>
    <rect x="-16" y="-120" width="32" height="78" fill="#2a2622"/>
    <line x1="0" y1="-120" x2="0" y2="-42" stroke="#f7f4ec" stroke-width="4"/>
    <rect x="-16" y="-136" width="32" height="16" rx="4" fill="#a4402f"/>
  </g>
</svg>
